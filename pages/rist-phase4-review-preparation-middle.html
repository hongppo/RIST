function p4LoadPreparation(){['collected-time','analyzed-time'].forEach(id=>{document.getElementById(id).value='';document.getElementById(id).disabled=false;});const rows=p4Rows(p4Name()),first=rows[0];for(const [id,c] of Object.entries(p4FieldMap)){const el=document.getElementById(id);if(!el)continue;el.value=String(first[c]??'').replaceAll(id==='collected'||id==='analyzed'?'/':'\u0000','-');if(el.type==='date')el.value=el.value.slice(0,10);const row=el.closest('.field-row');if(row){const source=row.querySelector('.source');const extracted=[2,5,6,11,14,15,16].includes(c)&&!!p4Seed(p4Name())[0][c];el.disabled=extracted;el.readOnly=false;source.textContent=extracted?'추출됨':'미추출';source.classList.toggle('extracted',extracted);row.classList.remove('changed');row.querySelector('.row-save').disabled=true;}}document.querySelector('.save-state').textContent='변경 사항: '+(p4Store[p4Name()]?.changes||0)+'개';}
document.querySelectorAll('.field-row').forEach(row=>{const fields=[...row.querySelectorAll('input')],b=row.querySelector('.row-save');fields.forEach(el=>el.addEventListener('input',()=>{b.disabled=false;row.classList.add('changed');}));b.onclick=()=>{const rows=structuredClone(p4Rows(p4Name()));fields.forEach(el=>{const c=p4FieldMap[el.id];if(c!==undefined)rows.forEach(r=>r[c]=el.value.replaceAll(el.type==='date'?'-':'\u0000','/'));});p4Store[p4Name()]={rows,stage:1,changes:(p4Store[p4Name()]?.changes||0)+1};p4Write();p4LoadPreparation();};});
document.querySelectorAll('[data-viewer-page="rist-phase4-review-detail-first"]').forEach(b=>{b.removeAttribute('data-viewer-page');b.onclick=()=>p4Navigate('rist-phase4-review-detail-first');});
const mapSave=document.querySelector('.map-save-actions .row-save');['region','latitude','longitude'].forEach(id=>document.getElementById(id).addEventListener('input',()=>mapSave.disabled=false));mapSave.onclick=()=>{const rows=structuredClone(p4Rows(p4Name()));rows.forEach(r=>{r[8]=document.getElementById('region').value;r[9]=document.getElementById('latitude').value;r[10]=document.getElementById('longitude').value;});p4Store[p4Name()]={rows,stage:1,changes:(p4Store[p4Name()]?.changes||0)+1};p4Write();mapSave.disabled=true;p4LoadPreparation();};
const p4Key='rist-phase4-review-v1';
const p4Read=()=>{try{return JSON.parse(window.name.startsWith(p4Key+':')?window.name.slice(p4Key.length+1):'{}')}catch{return {}}};
const p4Write=()=>{try{window.name=p4Key+':'+JSON.stringify(p4Store)}catch{}};
let p4Store=p4Read(),p4Group=P4.group||'CSV-003',p4Index=P4.index||0,p4Excluded=false;
if(p4Store.pending?.page!==P4.id)p4Store={};
const p4HistoricalNames=p4Store.pending?.names;
const p4Names=g=>(p4HistoricalNames?.[g]||(g==='CSV-003'?Array.from({length:5},(_,i)=>`VOCs_20261027_${String(i+1).padStart(2,'0')}.csv`):Array.from({length:3},(_,i)=>`대기종합오염도_20261027_${String(i+1).padStart(2,'0')}.xlsx`))).filter(n=>!p4Excluded||n!=='VOCs_20261027_03.csv');
const p4Name=()=>p4Names(p4Group)[p4Index];
function p4Seed(name){const excel=name.endsWith('.xlsx');const rows=Array.from({length:excel?120:171},(_,r)=>['환경','대기',name.replace(/\.[^.]+$/,''),'박보검','RIST','','2026/10/27','1','','','',['Benzene','Toluene','Ethylbenzene','Xylene','Styrene'][r%5],'','','',String((r+1)/10),'ppb']);if(name==='VOCs_20261027_01.csv')rows.forEach(x=>x[16]='');if(name==='VOCs_20261027_03.csv'){rows[2][15]='';rows[7][5]='2026/10/27';rows[7][6]='2026/10/26';}return rows;}
function p4Rows(name){return p4Store[name]?.rows||p4Seed(name)}
function p4Persist(){if(P4.stage===1){return;}p4Store[p4Name()]={...(p4Store[p4Name()]||{}),rows:structuredClone(data),stage:reviewStage};p4Write();}
function p4Navigate(page){p4Persist();p4Store.pending={page,group:p4Group,index:p4Index,excluded:p4Excluded,names:p4HistoricalNames};p4Write();const b=document.createElement('button');b.dataset.viewerPage=page;document.body.append(b);b.click();b.remove();}
const p4Pending=p4Store.pending;if(p4Pending?.page===P4.id){p4Group=p4Pending.group;p4Index=p4Pending.index;p4Excluded=!!p4Pending.excluded;delete p4Store.pending;p4Write();}
function p4Bar(){const names=p4Names(p4Group);document.getElementById('p4-group').textContent=p4Group;document.getElementById('p4-file').textContent=p4Name();document.getElementById('p4-position').textContent=`${p4Index+1} / ${names.length}`;document.getElementById('p4-prev').disabled=p4Index===0;document.getElementById('p4-next').disabled=p4Index===names.length-1;document.getElementById('p4-list').innerHTML=names.map((n,i)=>`<button role="option" aria-selected="${i===p4Index}" data-p4-file="${i}"><span>${n}</span><small>${i===p4Index?'현재 파일':p4Store[n]?.stage?'검토 중':'검토 대기'}</small></button>`).join('');const scope=document.querySelector('#detail-work-state .scope');if(scope)scope.textContent=`그룹 최종 저장 대상: ${p4Group} ${names.length}개 파일 / ${names.reduce((n,f)=>n+p4Rows(f).length,0)}행`;}
function p4Switch(i,focusIssue=false){if(i<0||i>=p4Names(p4Group).length)return;if(P4.stage!==1&&pendingInspectionEdit()){status('적용하지 않은 입력을 먼저 적용해 주세요.');return;}p4Persist();p4Index=i;p4Load();document.getElementById('p4-picker').open=false;if(focusIssue&&inspectionIssues.length)goToInspectionIssue(0);}
document.getElementById('p4-prev').onclick=()=>p4Switch(p4Index-1);document.getElementById('p4-next').onclick=()=>p4Switch(p4Index+1);
document.getElementById('p4-list').onclick=e=>{const b=e.target.closest('[data-p4-file]');if(b)p4Switch(+b.dataset.p4File);};
function p4Load(){p4Bar();if(P4.stage===1){p4LoadPreparation();return;}data=structuredClone(p4Rows(p4Name()));total=data.length;draft=structuredClone(data);shown=5;selection=new Set();column=null;inspectionEditTarget=null;history=[];changes=0;currentErrorCell=null;errorPage=0;pageRows=[];pageColumns=new Set();Object.keys(bulkValues).forEach(k=>delete bulkValues[k]);Object.keys(bulkAccepted).forEach(k=>delete bulkAccepted[k]);bulkTarget=null;onlyMissing=false;reviewStage=P4.stage===3?3:2;expanded=reviewStage===3;stageBulkState={2:false,3:true};inspectionHasRun=reviewStage===3;inspectionIssues=inspectionHasRun?collectInspectionIssues():[];onlyErrors=inspectionHasRun&&inspectionIssues.length>0;visibleColumns=incompleteColumns();if(inspectionHasRun)rebuildErrorPage(0);savedWorkData=JSON.stringify(data);hasWorkSave=false;render();syncErrorFilter();p4ErrorFileControls();p4Bar();}
function p4GroupIssues(){const saved=data;let found=[];p4Names(p4Group).forEach((name,i)=>{data=i===p4Index?saved:p4Rows(name);found.push(...collectInspectionIssues().map(x=>({...x,file:name,fileIndex:i})));});data=saved;return found;}
function p4ErrorFileControls(){const nav=document.getElementById('p4-error-files');if(!nav)return;nav.hidden=reviewStage!==3;const indexes=[...new Set(p4GroupIssues().map(x=>x.fileIndex))],at=indexes.indexOf(p4Index);document.getElementById('p4-error-file-count').textContent=`오류 파일 ${at<0?'—':at+1} / ${indexes.length}`;const prev=at>=0?indexes[at-1]:indexes.filter(i=>i<p4Index).at(-1),next=at>=0?indexes[at+1]:(indexes.find(i=>i>p4Index)??indexes[0]);document.getElementById('p4-error-file-prev').disabled=prev===undefined;document.getElementById('p4-error-file-next').disabled=next===undefined;document.getElementById('p4-error-file-prev').onclick=()=>p4Switch(prev,true);document.getElementById('p4-error-file-next').onclick=()=>p4Switch(next,true);}
function p4Popup(){p4Persist();const issues=p4GroupIssues();document.getElementById('inspection-title').textContent=`${p4Group} 그룹 검사 결과`;document.getElementById('inspection-count').textContent=`오류 파일 ${new Set(issues.map(x=>x.file)).size}개 / 전체 ${p4Names(p4Group).length}개 파일`;const grouped=[];const seen=new Set();issues.forEach(x=>{const whole=issues.filter(y=>y.file===x.file&&y.c===x.c&&y.reason===x.reason).length===p4Rows(x.file).length;const key=x.file+':'+x.c+':'+x.reason;if(whole&&seen.has(key))return;seen.add(key);grouped.push({...x,whole});});document.getElementById('inspection-groups').innerHTML=grouped.map((x,i)=>`<div class="issue-row"><strong>${esc(x.file)}</strong><span>${x.whole?'전체 행':x.r+1+'행'} / ${esc(cols[x.c][1])}<br>${esc(x.reason)}</span><button data-p4-issue="${i}">위치로 이동</button></div>`).join('');document.getElementById('inspection-groups').onclick=e=>{const b=e.target.closest('[data-p4-issue]');if(!b)return;const x=grouped[+b.dataset.p4Issue];document.getElementById('inspection-errors').close();p4Switch(x.fileIndex);const idx=inspectionIssues.findIndex(y=>y.r===x.r&&y.c===x.c);if(idx>=0)goToInspectionIssue(idx);};document.getElementById('inspection-freshness').textContent='파일과 행, 열을 확인하고 입력 위치로 이동해 수정해 주세요.';document.getElementById('inspection-errors').showModal();}
if(P4.stage!==1){
 const p4OldCommit=commitRows;commitRows=function(...args){p4OldCommit(...args);p4Persist();p4ErrorFileControls();};
 document.addEventListener('bulk-applied',()=>{p4Persist();p4ErrorFileControls();});
 const p4MapApply=document.getElementById('map-apply').onclick;document.getElementById('map-apply').onclick=()=>{p4MapApply();p4Persist();};
 const p4OldRender=render;render=function(){p4OldRender();p4Bar();};
 document.getElementById('final-check').onclick=async()=>{if(pendingInspectionEdit()){status('적용하지 않은 입력을 먼저 적용해 주세요.');return;}p4Persist();const progress=document.getElementById('inspection-progress-status');progress.hidden=false;progress.textContent=`${p4Group} 전체 ${p4Names(p4Group).length}개 파일 검사 중`;document.getElementById('final-check').disabled=true;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const issues=p4GroupIssues();document.getElementById('final-check').disabled=false;progress.hidden=true;if(issues.length){P4.stage=3;p4Load();p4Popup();}else{const names=p4Names(p4Group);document.querySelector('#inspection-confirm .inspection-body').innerHTML=`<p>유형 그룹: <strong>${p4Group}</strong></p><p>최종 저장 대상: <strong>${names.length}개 파일 / ${names.reduce((n,f)=>n+p4Rows(f).length,0)}행</strong></p><div class="inspection-pass">그룹 전체 검사 통과</div><p>선택 항목이 비어 있어도 저장할 수 있습니다. 파일별 원본과 결과 출처를 유지합니다.</p>`;document.getElementById('inspection-confirm').showModal();}};
 document.getElementById('inspection-save').onclick=()=>p4Navigate('rist-phase4-group-saving');
 const stageOne=document.querySelector('[data-viewer-page="rist-phase4-review-preparation-first"]');if(stageOne){stageOne.removeAttribute('data-viewer-page');stageOne.onclick=()=>p4Navigate('rist-phase4-review-preparation-first');}
}
p4Load();if(P4.openList)document.getElementById('p4-picker').open=true;
if(P4.popup)p4Popup();if(P4.focusIssue&&inspectionIssues.length)goToInspectionIssue(0);
window.addEventListener('message',e=>{if(e.source===parent&&e.data?.channel==='mockup-viewer-host'&&e.data.action==='document-target'&&e.data.anchor==='excluded'){p4Excluded=true;p4Index=0;p4Load();}});
</script></body></html>
