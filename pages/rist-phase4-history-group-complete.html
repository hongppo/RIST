    <span class="app-service-name">환경데이터 표준화 프로그램</span>

        <path d="M 4 6 L 8 10 L 12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </header><main class="history-main"><div class="page-heading"><h1>유형 그룹 상세</h1><div class="page-actions"><button class="action" id="back-bundle">묶음 상세로</button></div></div><div class="summary-card" id="group-meta"></div><p id="group-notice" class="notice-line" hidden></p><div class="panel-grid"><section class="file-pane" id="file-list" data-viewer-scroll-region tabindex="0" aria-label="파일 목록"></section><section class="result-pane" id="file-detail"></section></div></main><script>const scenarios={"partial": {"date": "2026/10/20", "stamp": "20261020", "states": ["complete", "review"], "expiry": ["", "2026/11/19"]}, "expiring": {"date": "2026/09/30", "stamp": "20260930", "states": ["review", "review"], "expiry": ["2026/10/30", "2026/11/19"]}, "expired": {"date": "2026/09/26", "stamp": "20260926", "states": ["complete", "expired"], "expiry": ["", "2026/10/26"]}, "complete": {"date": "2026/10/27", "stamp": "20261027", "states": ["complete", "complete"], "expiry": ["", ""]}, "other": {"date": "2026/10/20", "stamp": "20261020", "states": ["complete"], "expiry": [""], "owner": "김희진"}, "review": {"date": "2026/10/20", "stamp": "20261020", "states": ["review", "complete"], "expiry": ["2026/11/19", ""]}};const types=["CSV-003","EXCEL-004"];const statusName={complete:"최종 저장 완료",review:"검토 중",expired:"보관 기간 만료"};const names=(s,g)=>Array.from({length:g===0?5:3},(_,i)=>(g===0?"VOCs_":"대기종합오염도_")+s.stamp+"_"+String(i+1).padStart(2,"0")+(g===0?".csv":".xlsx"));const tag=(st,ex)=>`<span class="status-tag ${st==='complete'?'status-complete':''}">${statusName[st]}</span>${ex==='2026/10/30'?'<span class="status-tag expiry-badge">만료 예정</span>':''}`;function resume(s,g,stage=2,index=2){const group=types[g],ns={};types.forEach((t,i)=>ns[t]=names(s,i));const page=stage===1?'rist-phase4-review-preparation-first':'rist-phase4-review-detail-first';const store={pending:{page,group,index:Math.min(index,ns[group].length-1),names:ns}};ns[group].forEach(name=>{store[name]={stage,rows:Array.from({length:g===0?171:120},(_,r)=>['환경','대기',name.replace(/\.[^.]+$/,''),'박보검','RIST','',s.date,'1','','','','Benzene','','','',String((r+1)/10),'ppb'])}});window.name='rist-phase4-review-v1:'+JSON.stringify(store);const b=document.createElement('button');b.dataset.viewerPage=page;document.body.append(b);b.click();b.remove();}let context='complete',group=0;const mode='complete';function showGroup(key,g){context=key;group=g;const s=scenarios[key],st=mode,ex=st==='complete'?'':st==='expired'?'2026/10/26':(s.expiry[g]||'2026/11/19'),ns=names(s,g);document.querySelector('.page-heading h1').textContent='유형 그룹 상세';document.getElementById('group-meta').innerHTML=`<dl><div><dt>유형 그룹</dt><dd>${types[g]}</dd></div><div><dt>업로드</dt><dd>${s.date} 10:00</dd></div><div><dt>업로드한 사람</dt><dd>${s.owner||'박보검'}</dd></div></dl><dl><div><dt>상태</dt><dd>${tag(st,ex)}</dd></div><div><dt>${st==='complete'?'저장 파일 수':'보관 만료일'}</dt><dd>${st==='complete'?ns.length+'개':ex}</dd></div></dl>`;const notice=document.getElementById('group-notice');notice.hidden=st!=='expired'&&ex!=='2026/10/30';notice.textContent=st==='expired'?'보관 기간이 만료되어 이어서 검토할 수 없습니다. 보관 기간이 만료되어 원본을 다운로드할 수 없습니다.':'보관 기간이 2026/10/30에 만료됩니다.';document.getElementById('file-list').innerHTML=ns.map((n,i)=>`<div class="file-row"><button class="file-select" data-file="${i}" aria-selected="${i===0}">${n}<small>${statusName[st]}</small></button><button class="action file-download" type="button" data-download-file="${i}" data-file-id="${key}-${g}-${i}" data-file-name="${n}" aria-label="${n} 원본 파일 다운로드">원본 파일 다운로드</button></div>`).join('');document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>showFile(+b.dataset.file));document.querySelectorAll('[data-download-file]').forEach(b=>{let account='박보검';try{const k='rist-phase4-review-v1:';if(window.name.startsWith(k))account=JSON.parse(window.name.slice(k.length)).currentAccount||account;}catch{}const allowed=st==='complete'||(st==='review'&&(s.owner||'박보검')===account&&ex>='2026/10/27');b.disabled=!allowed;b.onclick=e=>{e.stopPropagation();if(!allowed)return;b.dispatchEvent(new CustomEvent('original-file-download-request',{bubbles:true,detail:{fileId:b.dataset.fileId,fileName:b.dataset.fileName,group:types[g],owner:s.owner||'박보검',status:st,expiresAt:ex}}));};});document.getElementById('back-bundle').dataset.viewerPage='rist-phase4-bundle-'+(['other','review'].includes(key)?'partial':key);if(['other','review'].includes(key))document.getElementById('back-bundle').dataset.viewerAnchor=key;showFile(0);}
function showFile(i){const s=scenarios[context],ns=names(s,group),n=ns[i];document.querySelectorAll('[data-file]').forEach(b=>b.setAttribute('aria-selected',String(+b.dataset.file===i)));const pane=document.getElementById('file-detail');if(mode==='expired'){pane.innerHTML=`<div class="summary-card" style="display:block"><h2>${n}</h2><p class="meta">업로드 ${s.date} 10:00 / ${s.owner||'박보검'}</p></div><div class="no-data">보관 기간이 만료되어 검토 데이터와 원본 파일을 사용할 수 없습니다.</div>`;return;}pane.innerHTML=`<div class="result-header"><h2>${n}</h2></div><p class="meta">파일별 결과 ${group===0?171:120}행 / 표시 5행</p><section class="table-panel"><div class="table-scroll" data-viewer-scroll-region tabindex="0"><table><thead><tr><th>행</th><th>시료명</th><th>분석 물질</th><th>결과</th><th>단위</th></tr></thead><tbody>${Array.from({length:5},(_,r)=>`<tr><td>${r+1}</td><td>${n.replace(/\.[^.]+$/,'')}</td><td>${['Benzene','Toluene','Ethylbenzene','Xylene','Styrene'][r]}</td><td>${(r+1)/10}</td><td>ppb</td></tr>`).join('')}</tbody></table></div></section>${mode==='review'?'<div class="page-actions"><button class="action primary" id="resume-group">이어서 검토</button></div>':''}`;const b=document.getElementById('resume-group');if(b)b.onclick=()=>resume(s,group,context==='expiring'&&group===0?1:2,2);}
showGroup(context,group);window.addEventListener('message',e=>{if(e.source===parent&&e.data?.channel==='mockup-viewer-host'&&e.data.action==='document-target'){const m=String(e.data.anchor||'').match(/^(partial|expiring|expired|complete|other|review)-(0|1)$/);if(m&&scenarios[m[1]].states[+m[2]]===mode)showGroup(m[1],+m[2]);}});</script></body></html>
