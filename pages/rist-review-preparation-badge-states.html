{margin:0 0 12px;font-size:15px}.region-label{display:block;margin-bottom:6px;color:#6e7c8b;font-size:12px}.region-combo input{border-color:#7a91aa;box-shadow:0 0 0 2px #edf2f8}.search-layer{position:absolute;top:40px;left:0;width:100%;z-index:20;border:1px solid #bdcad8;border-radius:6px;background:#fff;box-shadow:0 8px 24px #34445622;max-height:204px;overflow-y:auto;padding:6px}.no-results{padding:10px;color:#8a96a4;font-size:12px}.add-option{border:0;background:#f2f6fa;border-radius:4px;width:100%;padding:12px;text-align:left;color:#4f6a86;font-size:13px}.map{height:278px;margin-top:14px;border:1px solid #dce3e9;border-radius:6px;position:relative;overflow:hidden;background:#eaf0ee}.map svg{width:100%;height:100%;display:block}.map-caption{position:absolute;bottom:10px;left:10px;padding:6px 9px;background:#ffffffed;border:1px solid #d5dfe3;border-radius:4px;color:#637781;font-size:11px}.coordinates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.coordinate-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-size:12px}.coordinates input{font-variant-numeric:tabular-nums;font-size:13px;padding:0 9px}.footer{height:52px;margin-top:16px;display:flex;align-items:center;justify-content:space-between}.save-state{color:#65798e;font-size:13px}.primary{height:46px;min-width:268px;background:#5b6877;border:1px solid #536171;color:white;border-radius:6px;padding:0 22px;font-weight:600}.save-state strong{font-weight:600}

.app-profile { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; color: #41464e; background: #ffffff; font: inherit; font-size: 15px; cursor: pointer; }.app-user-icon { display: block; width: 24px; height: 24px; color: #757c86; }.app-profile-chevron { display: block; width: 16px; height: 16px; margin-left: 4px; color: #757c86; }
.app-profile{line-height:1.5;flex-shrink:0}.app-profile:focus-visible{outline:2px solid #7c8591;outline-offset:3px}.app-header{justify-content:space-between}
.badge-columns{display:block;height:480px}.badge-columns .input-panel{width:100%;height:100%}.badge-fields{padding:8px 20px}.badge-fields .field-row{height:98px;grid-template-columns:180px 1fr 62px}.badge-fields .source{display:inline-flex;white-space:nowrap}.source.matched{background:#e1edf8;color:#416987;border-color:#bacddd}.source.partial{background:#fff0d7;color:#946323;border-color:#e5cba0}.badge-fields input:disabled{background:#eef1f4;color:#85909c;border-color:#dbe0e6}.badge-fields .field-name{gap:8px}.badge-fields .field-control{max-width:820px}</style></head><body>
<header class="app-header"><span class="service">환경데이터 표준화 프로그램</span><button class="app-profile" type="button" aria-label="사용자 메뉴" aria-haspopup="menu" aria-expanded="false">

<main class="workspace" data-component="preparation-badge-states" data-component-title="데이터 검토 1단계 배지 상태" data-component-width="1280">
<div class="heading"><h1>데이터 검토</h1><div class="steps" id="preparation-stage-tabs" role="tablist" aria-label="검토 단계"><button class="step active" type="button" role="tab" aria-selected="true">1단계: 사전 준비</button><button class="step" type="button" role="tab" aria-selected="false" data-viewer-dialog="stage-save-dialog">2단계: 상세 검토</button></div></div>
<div class="file-bar"><div class="file-info"><span>배지 상태 예시</span></div><div class="tools" id="preparation-work-actions"><button type="button" class="icon-button" aria-label="작업 저장" title="작업 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 3h13l4 4v14H3V3h1M7 3v6h10V3M7 21v-8h10v8"/></svg></button><button type="button" class="icon-button" aria-label="되돌리기" title="되돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12" transform="translate(1 -2)"/></svg></button></div></div>
<div class="columns badge-columns"><div class="input-panel"><div class="panel-heading"><h2>입력 항목 · 배지 상태 예시</h2><span class="record-label">첫 번째 행의 값을 표시합니다.</span></div><div class="badge-fields"><div class="field-row" id="badge-extracted-row"><div class="field-name"><label for="badge-extracted">시료명</label><span class="source extracted">추출됨</span></div><div class="field-control"><div class="combo"><input id="badge-extracted" value="RIST_Sample" placeholder="드롭다운, 혹은 검색 후 선택 가능합니다." disabled ><span class="chevron" aria-hidden="true">⌄</span></div></div><button class="row-save" type="button" disabled>변경</button></div><div class="field-row" id="badge-empty-row"><div class="field-name"><label for="badge-empty">담당자</label><span class="source ">미추출</span></div><div class="field-control"><div class="combo"><input id="badge-empty" value="" placeholder="드롭다운, 혹은 검색 후 선택 가능합니다."  role=combobox aria-expanded=false><span class="chevron" aria-hidden="true">⌄</span></div></div><button class="row-save" type="button" disabled>변경</button></div><div class="field-row" id="badge-matched-row"><div class="field-name"><label for="badge-matched">분석법</label><span class="source matched">매칭</span></div><div class="field-control"><div class="combo"><input id="badge-matched" value="ES 09307.b 휘발성유기화합물 - 저온 농축 - 기체크로마토그래피" placeholder="드롭다운, 혹은 검색 후 선택 가능합니다." disabled role=combobox aria-expanded=false><span class="chevron" aria-hidden="true">⌄</span></div></div><button class="row-save" type="button" disabled>변경</button></div><div class="field-row" id="badge-partial-row"><div class="field-name"><label for="badge-partial">지역·관측 지점</label><span class="source partial">일부 매칭</span></div><div class="field-control"><div class="combo"><input id="badge-partial" value="포항 청림" placeholder="드롭다운, 혹은 검색 후 선택 가능합니다." disabled role=combobox aria-expanded=false><span class="chevron" aria-hidden="true">⌄</span></div></div><button class="row-save" type="button" disabled>변경</button></div></div></div></div><footer class="footer"><div class="save-state">변경 사항: 0개</div><button class="primary" type="button" data-viewer-dialog="stage-save-dialog">저장 후 상세 검토로 이동</button></footer></main><dialog class="stage-save-dialog" id="stage-save-dialog" aria-labelledby="stage-dialog-title" aria-describedby="stage-dialog-message"><div class="stage-dialog-body"><h2 id="stage-dialog-title">2단계로 이동</h2><p id="stage-dialog-message">변경 사항을 저장하고 2단계로 이동하시겠습니까?</p></div><div class="stage-dialog-actions"><button type="button" data-viewer-dialog-close>취소</button><button class="confirm" type="button" data-viewer-page="rist-review-detail">저장 후 이동</button></div></dialog><script>
// Local mockup state only; no server or database write.
(() => {
  const rows = [...document.querySelectorAll('.field-row')];
  const status = document.querySelector('.save-state');
  const original = {};
  const updateStatus = (savedNow = false) => {
    const count = rows.filter(row => row.classList.contains('changed')).length;
    status.textContent = `변경 사항: ${count}개`;
  };
  rows.forEach(row => {
    const fields = [...row.querySelectorAll('input, select')];
    const button = row.querySelector('.row-save');
    let saved = fields.map(field => Object.hasOwn(original, field.id) ? original[field.id] : field.value);
    const update = (savedNow = false) => {
      const changed = fields.some((field, index) => field.value !== saved[index]);
      row.classList.toggle('changed', changed);
      button.disabled = !changed;
      updateStatus(savedNow);
    };
    fields.forEach(field => { field.addEventListener('input', () => update()); field.addEventListener('change', () => update()); });
    button.setAttribute('aria-label', row.querySelector('label').textContent + ' 변경');
    button.addEventListener('click', () => {
      if (!fields.every(field => field.checkValidity())) { fields.find(field => !field.checkValidity()).reportValidity(); return; }
      saved = fields.map(field => field.value);
      update(true);
    });
  });
})();
</script></body></html>
