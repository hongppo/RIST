 table.innerHTML='<colgroup><col style="width:42px"><col style="width:46px">'+order.map(c=>`<col style="width:${cols[c][3]}px">`).join('')+'</colgroup><thead><tr><th class="lock-select">선택</th><th class="lock-number">행</th>'+order.map(c=>`<th scope="col" class="${column===c?'active-column':''}">${cols[c][1]}${required.includes(c)?'<span class="required-star" title="필수"> *</span>':''}</th>`).join('')+`</tr><tr id="bulk-input-row" ${expanded?'':'hidden'}><th class="lock-select" colspan="2">일괄 입력</th>`+order.map(c=>`<th data-bulk-col="${c}">${control(c,'','일괄',!(selection.size&&(c===column||c===mapCol&&[9,10,17].includes(column))))}</th>`).join('')+`</tr><tr id="change-apply-row" ${expanded?'':'hidden'}><th class="lock-select" colspan="2" style="font-size:11px">변경 적용</th>`+order.map(c=>`<th><div class="apply-pair">${c===mapCol?`<button data-map="bulk" ${selection.size&&[9,10,17].includes(column)?'':'disabled'} title="선택한 행의 좌표 변경">선택 변경</button><button data-map="all" ${selection.size&&[9,10,17].includes(column)?'':'disabled'} title="전체 171행의 좌표 변경">일괄 변경</button>`:`<button data-apply="selected" data-column="${c}" disabled title="직접 선택한 셀만 변경">선택 변경</button><button data-apply="all" data-column="${c}" disabled title="이 열 전체 171행 변경">일괄 변경</button>`}</div></th>`).join('')+`</tr></thead><tbody>`+Array.from({length:shown},(_,r)=>`<tr><td class="lock-select"><input type="checkbox" data-cell-row="${r}" aria-label="${r+1}행 ${column===null?'셀':cols[column][1]} 선택" ${selection.has(r)?'checked':''} ${column===null?'disabled':''}></td><td class="lock-number">${r+1}</td>`+order.map(c=>{const selected=column===c&&selection.has(r);return `<td data-r="${r}" data-c="${c}" tabindex="0" aria-label="${r+1}행 ${cols[c][1]}" aria-selected="${selected}" class="grid-cell ${selected?'chosen':''} ${validateMissing&&required.includes(c)&&String(data[r][c]??'').trim()===''?'missing':''} ${c!==mapCol&&dirty(r,c)?'edited':''}">${c===mapCol?`<button data-map="${r}">지도 보기</button>`:selected&&selection.size===1?`<div class="edit-cell">${control(c,draft[r][c],(r+1)+'행')}<button class="confirm-cell" aria-label="${r+1}행 ${cols[c][1]} 변경 확정" ${dirty(r,c)?'':'disabled'}>✓</button></div>`:`<span class="read">${esc(draft[r][c]??'—')}</span>`}</td>`}).join('')+'</tr>').join('')+'</tbody>';
 $('counts').textContent=`표시 ${shown}행 / 선택 ${selection.size}셀 / 전체 ${total}행`;$('toggle-bulk').setAttribute('aria-expanded',String(expanded));$('toggle-bulk').textContent=(expanded?'−':'+')+' 일괄 변경';$('detail-undo').disabled=!history.length;
}
function selectCell(r,c,event){if(column!==c||(!event.ctrlKey&&!event.metaKey&&!event.shiftKey)){selection=new Set([r]);anchor=r;}else if(event.shiftKey){selection=new Set(Array.from({length:Math.abs(r-anchor)+1},(_,i)=>Math.min(anchor,r)+i));}else{selection.has(r)?selection.delete(r):selection.add(r);anchor=r;}column=c;if(selection.size>1)expanded=true;render();if(selection.size===1&&c!==mapCol){const input=document.querySelector(`td[data-r="${r}"][data-c="${c}"] input`);input?.focus();}}
function capture(){history.push({data:structuredClone(data),changes});if(history.length>10)history.shift();}
function status(text){$('change-status').textContent=text;}
function commitRows(rows,c,value){capture();rows.forEach(r=>{data[r][c]=value;draft[r][c]=value;});changes++;status(`변경 사항: ${changes}개`);render();}
function inputValue(parent,c){const inputs=[...parent.querySelectorAll('input')];return cols[c][2]==='date'?inputs[0].value.replaceAll('-','/')+(inputs[1].value?' '+inputs[1].value:''):inputs[0]?.value??'';}
function closeLookup(){if(lookupInput)lookupInput.setAttribute('aria-expanded','false');lookupInput=null;$('lookup').hidden=true;}
function openLookup(input){closeLookup();lookupInput=input;input.setAttribute('aria-expanded','true');const key=input.dataset.lookup,query=input.value,list=$('lookup-list');list.innerHTML='';const matches=(options[key]||[]).filter(x=>x.includes(query));const add=document.createElement('button');add.textContent=query?`+ "${query}" 신규 추가`:'+ 신규 추가';add.className='add-option';add.onclick=()=>{const val=input.value.trim();if(!val){status('신규 항목명을 입력해 주세요.');return;}options[key].push(val);accept(val);};list.append(add);if(!matches.length){const empty=document.createElement('p');empty.textContent='검색 결과가 없습니다.';list.append(empty);}matches.forEach(value=>{const b=document.createElement('button');b.className='option';b.textContent=value;b.onclick=()=>accept(value);list.append(b);});const rect=input.getBoundingClientRect();$('lookup').hidden=false;$('lookup').style.left=Math.min(rect.left,950)+'px';$('lookup').style.top=Math.min(rect.bottom+4,520)+'px';}
function accept(value){const input=lookupInput;input.value=value;input.dataset.accepted=value;closeLookup();updateInput(input);}
function updateInput(input){const cell=input.closest('td[data-r]');if(cell){const r=+cell.dataset.r,c=+cell.dataset.c;draft[r][c]=inputValue(cell,c);cell.classList.toggle('edited',dirty(r,c));cell.querySelector('.confirm-cell').disabled=!dirty(r,c);}else if(input.closest('[data-bulk-col]'))document.querySelectorAll(`[data-apply][data-column="${column}"]`).forEach(b=>b.disabled=!selection.size||!inputValue(input.closest('[data-bulk-col]'),column).trim());}
function parseCoord(value,max){const m=value.match(/^(\d{1,3})°(\d{1,2})[′'](\d{1,2}(?:\.\d+)?)[″"]([NSEW])$/i);return !!m&&+m[1]<=max&&+m[2]<60&&+m[3]<60&&(+m[1]<max||(+m[2]===0&&+m[3]===0))&&(max===90?/^[NS]$/i:/^[EW]$/i).test(m[4]);}
function setMapCoords(lat,lng){$('map-lat').value=lat;$('map-lng').value=lng;updateMap();}
function updateMap(){const ok=parseCoord($('map-lat').value,90)&&parseCoord($('map-lng').value,180);$('map-apply').disabled=!ok;$('map-pin').hidden=!ok;$('map-state').textContent=ok?`${$('map-lat').value} / ${$('map-lng').value}`:'지도에서 위치를 선택하거나 좌표를 입력해 주세요.';}
function openMap(rows,origin){closeLookup();mapTargets=[...rows];if(!mapTargets.length){status('좌표를 적용할 셀 범위를 먼저 선택해 주세요.');return;}returnFocus=origin;const all=rows.length===total;$('map-target').textContent=all?`전체 ${total}개 행`:rows.length===1?`해당 행 · ${rows[0]+1}행`:`선택한 ${rows.length}개 행`;const pairs=new Set(rows.map(r=>data[r][9]+'|'+data[r][10]));$('map-site').value='';$('map-dialog').showModal();if(pairs.size>1){setMapCoords('','');$('map-state').textContent='여러 위치 · 새 좌표를 선택해 주세요.';}else setMapCoords(data[rows[0]][9]||'',data[rows[0]][10]||'');}
function closeMap(){$('map-dialog').close();returnFocus?.focus();}
let cellDrag=null, suppressCellClick=false;
document.addEventListener('mousedown',e=>{const cell=e.target.closest('td[data-r]');if(e.button!==0||!cell||e.ctrlKey||e.metaKey||e.shiftKey||e.target.closest('input,button,select,textarea'))return;cellDrag={row:+cell.dataset.r,col:+cell.dataset.c,x:e.clientX,y:e.clientY,last:+cell.dataset.r,moved:false};});
document.addEventListener('mousemove',e=>{if(!cellDrag)return;if(!cellDrag.moved&&Math.hypot(e.clientX-cellDrag.x,e.clientY-cellDrag.y)<5)return;cellDrag.moved=true;e.preventDefault();window.getSelection()?.removeAllRanges();const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('td[data-r]');if(target)cellDrag.last=+target.dataset.r;column=cellDrag.col;anchor=cellDrag.row;selection=new Set(Array.from({length:Math.abs(cellDrag.last-anchor)+1},(_,i)=>Math.min(anchor,cellDrag.last)+i));document.querySelectorAll('td[data-r]').forEach(cell=>{const selected=+cell.dataset.c===column&&selection.has(+cell.dataset.r);cell.classList.toggle('chosen',selected);cell.setAttribute('aria-selected',selected);});document.querySelectorAll('[data-cell-row]').forEach(check=>{check.checked=selection.has(+check.dataset.cellRow);check.setAttribute('aria-label',`${+check.dataset.cellRow+1}행 ${cols[column][1]} 선택`);});});
document.addEventListener('mouseup',()=>{if(!cellDrag)return;const moved=cellDrag.moved;cellDrag=null;if(moved){suppressCellClick=true;if(selection.size>1)expanded=true;render();setTimeout(()=>suppressCellClick=false,0);}});
window.addEventListener('blur',()=>{cellDrag=null;});
document.addEventListener('click',e=>{const check=e.target.closest('[data-cell-row]');if(check){if(column===null)return;const r=+check.dataset.cellRow;check.checked?selection.add(r):selection.delete(r);anchor=r;if(selection.size>1)expanded=true;render();return;}if(suppressCellClick){e.preventDefault();return;}const map=e.target.closest('[data-map]');if(map){if(e.ctrlKey||e.metaKey||e.shiftKey){const cell=map.closest('td');if(cell)selectCell(+cell.dataset.r,mapCol,e);return;}openMap(map.dataset.map==='all'?Array.from({length:total},(_,i)=>i):map.dataset.map==='bulk'?[...selection]:[+map.dataset.map],map);return;}
 const confirm=e.target.closest('.confirm-cell');if(confirm){const cell=confirm.closest('td'),c=+cell.dataset.c;if(cell.querySelector('[data-lookup]')&&cell.querySelector('[data-lookup]').dataset.accepted!==draft[+cell.dataset.r][c])return;if([9,10].includes(c)&&!parseCoord(draft[+cell.dataset.r][c],c===9?90:180)){status('도분초 좌표를 확인해 주세요.');return;}commitRows([+cell.dataset.r],c,draft[+cell.dataset.r][c]);return;}
 const input=e.target.closest('[data-lookup]');if(input&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){openLookup(input);return;}
 const cell=e.target.closest('td[data-r]');if(cell){if(e.target.matches('input')&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey)return;selectCell(+cell.dataset.r,+cell.dataset.c,e);return;}
 if(e.target.matches('[data-apply]')){const parent=document.querySelector(`[data-bulk-col="${column}"]`),value=inputValue(parent,column);if([9,10].includes(column)&&!parseCoord(value,column===9?90:180)){status('도분초 좌표를 확인해 주세요.');return;}commitRows(e.target.dataset.apply==='all'?Array.from({length:total},(_,i)=>i):[...selection],column,value);return;}
 if(!$('lookup').contains(e.target))closeLookup();
});
document.addEventListener('input',e=>{if(e.target.matches('[data-lookup]')){openLookup(e.target);const cell=e.target.closest('td');if(cell)cell.querySelector('.confirm-cell').disabled=true;else document.querySelectorAll('[data-apply]').forEach(b=>b.disabled=true);return;}if(e.target.closest('td[data-r]')||e.target.closest('[data-bulk-col]'))updateInput(e.target);});
$('toggle-bulk').onclick=()=>{expanded=!expanded;render();};document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{shown=Math.min(total,b.dataset.load==='all'?total:shown+Number(b.dataset.load));render();});
$('detail-work-save').onclick=()=>{history=[];status('작업 저장 완료 · 되돌리기 기준점 갱신');render();};$('detail-undo').onclick=()=>{const last=history.pop();if(last){data=last.data;draft=structuredClone(data);changes=last.changes;status(`변경 사항: ${changes}개`);render();}};
$('map-cancel').onclick=closeMap;$('map-close').onclick=closeMap;$('map-lat').oninput=updateMap;$('map-lng').oninput=updateMap;
$('map-site').onchange=()=>{const b=$('map-site').value.endsWith('B');if(options.region.includes($('map-site').value))setMapCoords(b?'36°02′00.00″N':'36°01′28.20″N',b?'129°22′40.00″E':'129°22′23.88″E');};
$('map-canvas').onclick=e=>{const b=e.currentTarget.getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),y=Math.max(0,Math.min(1,(e.clientY-b.top)/b.height));$('map-site').value='';setMapCoords(`36°01′${(10+40*y).toFixed(2)}″N`,`129°22′${(10+40*x).toFixed(2)}″E`);$('map-pin').style.left=(x*100)+'%';$('map-pin').style.top=(y*100)+'%';};
$('map-apply').onclick=()=>{capture();mapTargets.forEach(r=>{data[r][9]=draft[r][9]=$('map-lat').value;data[r][10]=draft[r][10]=$('map-lng').value;});changes++;closeMap();status(`좌표 적용 완료 · ${mapTargets.length}개 행 · 변경 사항: ${changes}개`);render();};
$('final-check').onclick=()=>{validateMissing=true;const missing=[];data.forEach((row,r)=>required.forEach(c=>{if(String(row[c]??'').trim()==='')missing.push([r,c]);}));if(missing.length){const [r,c]=missing[0];shown=Math.max(shown,r+1);column=c;selection=new Set([r]);render();const cell=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`);cell.classList.add('missing');cell.scrollIntoView({block:'nearest',inline:'center'});status(`필수값 ${missing.length}개 누락 · 첫 누락: ${r+1}행 ${cols[c][1]}`);return;}if(draft.some((row,r)=>row.some((v,c)=>v!==data[r][c]))){status('확정하지 않은 셀 변경을 먼저 적용해 주세요.');return;}document.querySelector('[data-viewer-page="rist-save-confirm"]').click();};
document.addEventListener('scroll',e=>{if(!$('lookup').contains(e.target))closeLookup();},true);window.addEventListener('mockup-viewer:viewport-motion',closeLookup);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLookup();});render();

</script></body></html>
