<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파일 업로드(단일 파일 선택)</title><style>
    * { box-sizing: border-box; }

    body { width: 1280px; height: 800px; color: #25282d; background: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.5; }

    .upload-error { margin: 16px 0 0; color: #c43434; font-size: 14px; line-height: 22px; }

  html,body{overflow:hidden}main.flow{height:720px;padding:28px 56px;display:flex;flex-direction:column;gap:16px}.heading{display:flex;align-items:center;justify-content:space-between}.heading h1{font-size:28px;margin:0}.muted{color:#747e8a;font-size:14px;margin:0}.panel{background:#fff;border:1px solid #d1d5db;border-radius:8px;overflow:hidden}.scroll{overflow:auto;min-height:0;flex:1;overscroll-behavior:contain}.panel-top{padding:16px 20px;border-bottom:1px solid #e2e5e9;display:flex;align-items:center;justify-content:space-between}.panel-top h2{font-size:17px;margin:0}.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border:1px solid #aeb5be;border-radius:6px;background:white;color:#41464e;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}.btn.primary{background:#535860;color:#fff;border-color:#535860}.btn:disabled{background:#dce0e5;color:#9198a2;border-color:#d0d4da;cursor:default}.actions{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex:none}.actions .muted{margin-right:auto}.summary{display:flex;gap:28px;padding:16px 20px;background:#fff;border:1px solid #d1d5db;border-radius:8px}.summary strong{margin-left:8px}.group{padding:16px 20px;background:#edf0f3;font-size:16px;font-weight:650}.group span{font-size:13px;font-weight:400;color:#687583;margin-left:16px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:12px 20px;border-bottom:1px solid #e6e8eb}th{background:#f7f8fa;color:#6c7784;font-weight:500}td:first-child{width:48%}.remove{width:30px;height:30px;border:1px solid #d0d6dd;background:white;border-radius:5px;font-size:20px;color:#727c86;cursor:pointer}.remove:hover{border-color:#ae4545;color:#ae4545}.tag{display:inline-block;font-size:12px;border-radius:4px;border:1px solid #d6dce3;padding:2px 7px;color:#637180;background:#f4f6f8}.tag.warn{color:#946a28;border-color:#e4ce9f;background:#fff7e7}.notice{padding:12px 18px;background:#fff7e7;border:1px solid #e6d3ad;border-radius:6px;font-size:14px;color:#8b682f}.progress{height:8px;background:#e4e8ed;border-radius:5px;margin:12px 0}.progress span{display:block;width:37.5%;height:100%;background:#65798c;border-radius:5px}.file-drop-area{width:100%;height:300px}.upload-main .split-entry{margin-top:28px;padding-top:24px;border-top:1px solid #d1d5db;display:flex;justify-content:space-between;align-items:center}.error-text{color:#b74b48}.footnote{font-size:13px;color:#75808c;margin:0}.heading .btn{height:38px;font-size:13px}.scroll:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #758da7;outline-offset:2px}[hidden]{display:none!important}.upload-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.upload-option{min-width:0}.upload-option .file-drop-area{height:400px;padding:28px;text-align:center}.upload-option h2{margin:0 0 12px;font-size:23px;letter-spacing:-.03em}.upload-option .file-drop-message{font-size:16px;margin-bottom:20px}.upload-option .file-upload-icon{margin-bottom:20px}.upload-option .file-status{font-size:13px;color:#75818f;margin:16px 0 0;max-width:100%;overflow-wrap:anywhere;min-height:40px}.file-drop-area.dragover{border-color:#667f99;background:#eef4fa}.upload-option .upload-actions{margin-top:20px}.upload-submit-button:not(:disabled){background:#535860;color:white;cursor:pointer}.file-status.error{color:#b84c49}.file-drop-area.selected{border:2px solid #718aa4;background:#eef4fa}.file-status{max-height:72px;overflow:auto}.file-status strong{color:#45627f}.upload-actions{justify-content:flex-end}.file-drop-area{position:relative}.cancel-file-selection{position:absolute;right:14px;top:14px;width:30px;height:30px;padding:0;border:1px solid #b7c5d3;border-radius:5px;background:white;color:#536b83;font-size:21px;line-height:1;cursor:pointer}</style></head><body><header class="app-header">
    <span class="app-service-name">환경데이터 표준화 프로그램</span>
    <button data-viewer-page="rist-phase4-history-menu" class="app-profile" type="button" aria-label="사용자 메뉴" aria-haspopup="menu" aria-expanded="false">

      </svg>
      <span>박보검</span>

        <path d="M 4 6 L 8 10 L 12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </header><main class="upload-main"><section class="file-upload" aria-labelledby="upload-title"><h1 class="upload-title" id="upload-title">파일 업로드</h1><div class="upload-options"><section class="upload-option" aria-labelledby="single-title"><div class="file-drop-area" id="single-drop" aria-label="파일 1개 업로드 드래그 영역"><button type="button" class="cancel-file-selection" id="single-cancel" aria-label="파일 선택 취소" title="파일 선택 취소" hidden>×</button><svg class="file-upload-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M 24 31 V 7 M 15 16 L 24 7 L 33 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M 8 30 V 39 A 3 3 0 0 0 11 42 H 37 A 3 3 0 0 0 40 39 V 30" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg><h2 id="single-title">파일 1개 업로드</h2><p class="file-drop-message">파일 1개를 끌어 놓거나 선택해 주세요.<br>파일당 20MB 이하</p><input type="file" id="single-input" hidden><button class="file-select-button" id="single-choose" type="button">파일 1개 선택</button><p class="file-status" id="single-status" role="status">파일을 선택한 뒤 업로드 및 추출을 진행합니다.</p></div></section><section class="upload-option" aria-labelledby="multiple-title"><div class="file-drop-area" id="multiple-drop" aria-label="여러 파일 업로드 드래그 영역"><button type="button" class="cancel-file-selection" id="multiple-cancel" aria-label="파일 선택 취소" title="파일 선택 취소" hidden>×</button><svg class="file-upload-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M 24 31 V 7 M 15 16 L 24 7 L 33 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M 8 30 V 39 A 3 3 0 0 0 11 42 H 37 A 3 3 0 0 0 40 39 V 30" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg><h2 id="multiple-title">여러 파일 업로드</h2><p class="file-drop-message">여러 파일을 끌어 놓거나 선택해 주세요.<br>최대 20개 / 파일당 20MB 이하</p><input type="file" id="multiple-input" multiple hidden><button class="file-select-button" id="multiple-choose" type="button">여러 파일 선택</button><p class="file-status" id="multiple-status" role="status">파일 접수 후 유형 분석을 시작합니다.</p></div></section></div><div class="upload-actions"><button class="upload-submit-button" id="upload-next" type="button" disabled>다음 단계로</button></div></section></main><script>(()=>{let mode=null;const next=document.getElementById('upload-next'),hints={single:'파일을 선택한 뒤 업로드 및 추출을 진행합니다.',multiple:'파일 접수 후 유형 분석을 시작합니다.'};function receive(kind,files){if(!files.length)return;const state=document.getElementById(kind+'-status');const MB=1024*1024;const limitError=kind==='multiple'&&files.length>20?'파일은 한 번에 최대 20개까지 업로드할 수 있습니다. 20개 이하로 다시 선택해 주세요.':kind==='multiple'&&[...files].reduce((sum,f)=>sum+(f.size||0),0)>400*MB?'전체 업로드 용량은 최대 400MB까지 가능합니다. 전체 400MB 이하로 다시 선택해 주세요.':[...files].some(f=>(f.size||0)>20*MB)?'파일당 20MB 이하의 파일로 다시 선택해 주세요.':'';if(limitError){mode=null;['single','multiple'].forEach(k=>{document.getElementById(k+'-input').value='';document.getElementById(k+'-drop').classList.remove('selected');document.getElementById(k+'-cancel').hidden=true;const status=document.getElementById(k+'-status');status.classList.remove('error');status.textContent=hints[k];});state.classList.add('error');state.textContent=limitError;next.disabled=true;delete next.dataset.viewerPage;return;}if(kind==='single'&&files.length!==1){state.classList.add('error');state.textContent='파일 1개만 선택해 주세요.';return;}mode=kind;['single','multiple'].forEach(k=>{const active=k===kind,drop=document.getElementById(k+'-drop'),status=document.getElementById(k+'-status');drop.classList.toggle('selected',active);document.getElementById(k+'-cancel').hidden=!active;status.classList.remove('error');status.replaceChildren();if(active){const strong=document.createElement('strong');strong.textContent=files.length+'개 파일 선택됨';status.append(strong);}else{status.textContent=hints[k];document.getElementById(k+'-input').value='';}});next.disabled=false;next.dataset.viewerPage=mode==='single'?'rist-processing':'rist-phase4-upload-analyzing';}['single','multiple'].forEach(kind=>{const input=document.getElementById(kind+'-input'),drop=document.getElementById(kind+'-drop');document.getElementById(kind+'-cancel').onclick=e=>{e.preventDefault();e.stopPropagation();mode=null;['single','multiple'].forEach(k=>{document.getElementById(k+'-input').value='';document.getElementById(k+'-drop').classList.remove('selected','dragover');document.getElementById(k+'-cancel').hidden=true;const status=document.getElementById(k+'-status');status.classList.remove('error');status.textContent=hints[k];});next.disabled=true;delete next.dataset.viewerPage;const link=document.createElement('button');link.dataset.viewerPage='rist-phase4-upload-single';document.body.append(link);link.click();link.remove();};document.getElementById(kind+'-choose').onclick=()=>input.click();input.onchange=()=>receive(kind,input.files);drop.ondragover=e=>{e.preventDefault();drop.classList.add('dragover');};drop.ondragleave=()=>drop.classList.remove('dragover');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('dragover');receive(kind,e.dataTransfer.files);};});receive("single",[{"name": "VOCs_20261027_01.csv"}]);})();</script></body></html>
