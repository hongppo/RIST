ound:#fff7e7;border:1px solid #e6d3ad;border-radius:6px;font-size:14px;color:#8b682f}.progress{height:8px;background:#e4e8ed;border-radius:5px;margin:12px 0}.progress span{display:block;width:37.5%;height:100%;background:#65798c;border-radius:5px}.file-drop-area{width:100%;height:300px}.upload-main .split-entry{margin-top:28px;padding-top:24px;border-top:1px solid #d1d5db;display:flex;justify-content:space-between;align-items:center}.error-text{color:#b74b48}.footnote{font-size:13px;color:#75808c;margin:0}.heading .btn{height:38px;font-size:13px}.scroll:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #758da7;outline-offset:2px}[hidden]{display:none!important}</style></head><body><header class="app-header">
