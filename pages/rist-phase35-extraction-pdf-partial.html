<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추출 실패 안내(PDF 일부 실패)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { width: 1280px; height: 800px; color: #25282d; background: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.5; }
    .app-header { display: flex; align-items: center; justify-content: space-between; width: 1280px; max-width: 100%; height: 80px; padding: 0 56px; border-bottom: 1px solid #d1d5db; background: #ffffff; }
    .app-service-name { color: #24272c; font-size: 22px; font-weight: 700; line-height: 1.4; letter-spacing: -0.035em; }
    .app-profile { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; color: #41464e; background: #ffffff; font: inherit; font-size: 15px; cursor: pointer; }
    .app-user-icon { display: block; width: 24px; height: 24px; color: #757c86; }
    .app-profile-chevron { display: block; width: 16px; height: 16px; margin-left: 4px; color: #757c86; }
    .app-profile:focus-visible, .file-select-button:focus-visible { outline: 2px solid #7c8591; outline-offset: 3px; }
    .upload-main { width: 1056px; margin: 44px auto 0; }
    .file-upload { width: 1056px; max-width: 100%; }
    .upload-title { margin: 0 0 24px; color: #24272c; font-size: 32px; font-weight: 700; line-height: 1.4; letter-spacing: -0.045em; }
    .file-drop-area { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 330px; padding: 36px; border: 2px dashed #c2c8d0; border-radius: 10px; background: #ffffff; }
    .file-upload-icon { display: block; width: 48px; height: 48px; margin-bottom: 22px; color: #8a929e; }
    .file-drop-message { margin: 0 0 22px; color: #515761; font-size: 20px; font-weight: 500; line-height: 1.5; letter-spacing: -0.025em; }
    .file-select-button { min-width: 132px; height: 44px; padding: 0 24px; border: 1px solid #aeb5be; border-radius: 6px; color: #41464e; background: #ffffff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .upload-error { margin: 16px 0 0; color: #c43434; font-size: 14px; line-height: 22px; }
    .upload-actions { display: flex; align-items: center; justify-content: flex-end; gap: 20px; margin-top: 32px; }
    .upload-submit-button { min-width: 172px; height: 48px; padding: 0 24px; border: 1px solid #d0d4da; border-radius: 6px; color: #9198a2; background: #dce0e5; font: inherit; font-size: 16px; font-weight: 650; cursor: not-allowed; }
  
html,body{overflow:hidden}
.extraction-result{position:fixed;inset:0;width:760px;height:620px;max-width:none;max-height:none;margin:auto;padding:32px;border:1px solid #d1d5db;border-radius:12px;background:#fff;color:#25282d;box-shadow:0 20px 64px #18263833;overflow:hidden;font-family:inherit}
.extraction-result::backdrop{background:rgba(28,35,45,.44)}
.result-content{height:100%;display:flex;flex-direction:column}
.result-title{font-size:26px;line-height:36px;margin:0 0 18px;letter-spacing:-.035em}
.result-message{font-size:16px;line-height:26px;margin:0 0 18px;word-break:keep-all}
.result-summary{font-size:16px;font-weight:600;background:#f3f5f7;border:1px solid #e0e4e9;border-radius:6px;padding:12px 16px;margin:0 0 22px}
.result-list-title{font-size:16px;line-height:24px;margin:0 0 10px}
.result-list{height:152px;min-height:0;flex-shrink:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;border:1px solid #dce1e7;border-radius:6px;background:#fafbfc}
.result-item{min-height:82px;padding:14px 18px;border-bottom:1px solid #e1e5ea;overflow-wrap:anywhere}
.result-item:last-child{border-bottom:0}.result-item strong{display:block;font-size:15px;line-height:23px;font-weight:600}.result-item p{margin:5px 0 0;color:#5d6570;font-size:14px;line-height:22px}
.result-hint{margin:16px 0 0;font-size:14px;color:#606873;line-height:22px}
.result-actions{margin-top:auto;display:flex;justify-content:flex-end;gap:12px;padding-top:20px;border-top:1px solid #e6e9ee}
.result-button{height:46px;padding:0 20px;border:1px solid #acb3bd;border-radius:6px;background:white;color:#41464e;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.result-button.primary{background:#535860;color:#fff;border-color:#535860}.result-button:focus-visible,.result-list:focus-visible{outline:2px solid #536f95;outline-offset:3px}
</style>
</head>
<body>
  <header class="app-header" data-component="app-header" data-component-title="공통 헤더" data-component-width="1280">
    <span class="app-service-name">환경데이터 표준화 프로그램</span>
    <button class="app-profile" type="button" aria-label="사용자 메뉴" data-viewer-page="rist-profile-menu" aria-haspopup="menu" aria-expanded="false">
      <svg class="app-user-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"></circle>
        <path d="M 5 21 V 19 A 7 7 0 0 1 19 19 V 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span>박보검</span>
      <svg class="app-profile-chevron" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 4 6 L 8 10 L 12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </header>

  <main class="upload-main">
    <section class="file-upload" aria-labelledby="upload-title" data-component="file-upload" data-component-title="파일 업로드" data-component-width="1056">
      <h1 class="upload-title" id="upload-title">파일 업로드</h1>
      <div class="file-drop-area" aria-label="파일 1개 드래그 앤드 드롭 영역">
        <svg class="file-upload-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M 24 31 V 7 M 15 16 L 24 7 L 33 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M 8 30 V 39 A 3 3 0 0 0 11 42 H 37 A 3 3 0 0 0 40 39 V 30" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <p class="file-drop-message">파일 1개를 끌어 놓거나 선택해 주세요.</p>
        <button class="file-select-button" type="button">파일 선택</button>
      </div>

      <div class="upload-actions">
        <button class="upload-submit-button" type="button" disabled>업로드 및 추출</button>
      </div>
    </section>
  </main>
<dialog id="extraction-result" class="extraction-result" aria-labelledby="result-title" aria-describedby="result-message"><div class="result-content"><h1 id="result-title" class="result-title">추출 결과 확인</h1><p id="result-message" class="result-message">일부 항목을 추출하지 못했습니다. 정상적으로 추출된 항목은 검토를 계속할 수 있습니다.</p><p class="result-summary">전체 3개 보고서 중 2개 추출 완료, 1개 추출 실패</p><h2 class="result-list-title">추출하지 못한 항목</h2><div class="result-list" tabindex="0" role="region" aria-label="추출하지 못한 항목"><div class="result-item"><strong>대기 시험결과서 (7-9페이지)</strong><p>분석물질과 결과값의 연결 관계를 확인할 수 없습니다.</p></div></div><p class="result-hint">실패한 항목은 검토 대상에 포함되지 않습니다.</p><div class="result-actions"><button type="button" class="result-button" data-viewer-page="rist-upload">업로드 화면으로 돌아가기</button><button type="button" class="result-button primary" data-viewer-page="rist-phase2-review-preparation">정상 항목 검토하기</button></div></div></dialog><script>const resultDialog=document.getElementById("extraction-result");resultDialog.addEventListener("cancel",event=>event.preventDefault());resultDialog.showModal();</script>
</body>
</html>
