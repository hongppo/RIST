const options={category:['환경','공정','설비','원료','제품','품질','안전','에너지'],medium:['부산물','대기','악취'],owner:['김희진','김민수','김서연','김지훈'],institution:['RIST','포항산업과학연구원','환경분석센터'],base:['습식','건식'],sampling:['직접 채취','흡착관법'],analysis:['SIFT-MS','GC-MS','시험방법 ES 01501.1'],unit:['ppb','ppm','mg/m³'],region:['포항 관측 지점 A','포항 관측 지점 B']};
function makeControl(col,val,scope){const [key,label,kind]=col,id=scope+'-'+key,attrs=`id="${id}" data-key="${key}" aria-label="${scope} ${label}"`;let c;
 if(kind==='combo'||kind==='fixed')c=`<div class="combo"><input ${attrs} data-lookup="${key}" role="combobox" aria-expanded="false" aria-autocomplete="list" value="${esc(val)}" placeholder="${key==='region'?'—':'검색 혹은 선택'}" ${kind==='fixed'?'readonly':''}><span class="chevron" aria-hidden="true">⌄</span></div>`;
 else if(kind==='date'){const [date='',time='']=(val||'').replaceAll('/','-').split(' ');c=`<div class="date-control"><input ${attrs} type="date" value="${date}"><input data-time="${key}" type="time" step="1" value="${time}" aria-label="${scope} ${label} 시각"></div>`;}
 else if(kind==='number')c=`<div class="number-control"><input ${attrs} type="number" min="1" value="${esc(val)}"><span>일</span></div>`;
 else c=`<input ${attrs} type="text" value="${esc(val)}" placeholder="${kind==='coord'?'도° 분′ 초″':'입력'}">`;
 return c;}
function rowDirty(r,c){return c>=8&&c<=10?draft[r].slice(8,11).join('|')!==saved[r].slice(8,11).join('|'):draft[r][c]!==saved[r][c];}
function renderRows(){ $('data-rows').innerHTML=draft.map((row,r)=>`<tr class="${selected.has(r)?'selected':''}"><td class="lock-select"><input type="checkbox" data-row="${r}" aria-label="${r+1}행 선택" ${selected.has(r)?'checked':''}></td><td class="lock-number">${r+1}</td>`+cols.map((col,c)=>`<td>${selected.has(r)?`<div class="cell ${rowDirty(r,c)?'dirty':''}" data-r="${r}" data-c="${c}"><div class="control">${makeControl(col,row[c],'row-'+r)}</div>${c===9||c===10?'':`<button class="cell-save" type="button" ${rowDirty(r,c)?'':'disabled'} aria-label="${r+1}행 ${c===8?'지역명·좌표':col[1]} 저장">저장</button>`}</div>`:`<span class="read" title="${esc(row[c]||'—')}">${esc(row[c]||'—')}</span>`}</td>`).join('')+'</tr>').join('');updateSelection();}
function updateSelection(){$('select-all').checked=selected.size===171;$('select-all').indeterminate=selected.size>0&&selected.size<171;$('counts').textContent=`표시 5행 / 선택 ${selected.size}행 / 전체 171행`;}
function markCell(r,c){const cell=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);if(!cell)return;cell.classList.toggle('dirty',rowDirty(r,c));const btn=cell.querySelector('.cell-save');if(btn)btn.disabled=!rowDirty(r,c)||(c===8&&!(validCoord(draft[r][9],90)&&validCoord(draft[r][10],180)));}
function syncGeo(scope){if(scope.startsWith('row-')){const r=Number(scope.slice(4));for(let c=8;c<=10;c++){const input=$(scope+'-'+cols[c][0]);if(input)input.value=draft[r][c]||'';markCell(r,c);}}}
function record(input){const cell=input.closest('.cell');if(cell){const r=+cell.dataset.r,c=+cell.dataset.c;if(cols[c][2]==='date'){const inp=cell.querySelectorAll('input');draft[r][c]=inp[0].value.replaceAll('-','/')+' '+inp[1].value;}else draft[r][c]=input.value;if(c===9||c===10){draft[r][8]=null;syncGeo('row-'+r);}markCell(r,c);}else if(input.id.startsWith('bulk-')||input.closest('thead')){let key=input.dataset.key||input.dataset.time;if(key==='lat'||key==='lng'){$('bulk-region').value='';key='region';}document.querySelectorAll(`[data-bulk="${key}"]`).forEach(b=>b.disabled=key==='region'?!(validCoord($('bulk-lat').value,90)&&validCoord($('bulk-lng').value,180)):!input.value);}}
function closeLookup(){if(active){active.setAttribute('aria-expanded','false');active.closest('.cell')?.classList.remove('open');}active=null;$('lookup').hidden=true;}
function openLookup(input,filter=false){closeLookup();active=input;input.setAttribute('aria-expanded','true');input.closest('.cell')?.classList.add('open');const key=input.dataset.lookup,query=filter?input.value.trim():'';const items=(options[key]||[]).filter(x=>x.startsWith(query));const list=$('lookup-list');list.replaceChildren();list.setAttribute('aria-label',cols.find(c=>c[0]===key)[1]+' 목록');if(!query||!items.length){const add=document.createElement('button');add.className='add-option';add.textContent=query?`+ "${query}" 신규 추가`:'+ 신규 추가';add.onclick=()=>openAdd(key,query);list.append(add);}if(!items.length){const empty=document.createElement('div');empty.className='empty-result';empty.textContent='검색 결과가 없습니다.';list.prepend(empty);}items.forEach(name=>{const b=document.createElement('button');b.className='option';b.setAttribute('role','option');b.textContent=name;b.onclick=()=>choose(name);list.append(b);});const rect=input.getBoundingClientRect();$('lookup').hidden=false;const h=$('lookup').offsetHeight;$('lookup').style.left=Math.min(rect.left,1280-310)+'px';$('lookup').style.top=(rect.bottom+6+h<800?rect.bottom+6:Math.max(8,rect.top-h-6))+'px';}
function choose(name){if(!active)return;const input=active,key=input.dataset.lookup;input.value=name;input.dataset.accepted=name;if(key==='region'){const pair=name.endsWith('B')?['36°02′00.00″N','129°22′40.00″E']:['36°01′28.20″N','129°22′23.88″E'];const scope=input.id.slice(0,-7);if(scope.startsWith('row-')){draft[+scope.slice(4)].splice(8,3,name,...pair);syncGeo(scope);}else {$('bulk-lat').value=pair[0];$('bulk-lng').value=pair[1];document.querySelectorAll('[data-bulk="region"]').forEach(b=>b.disabled=false);}}else record(input);closeLookup();updateBulkPending();}
function openAdd(key,name=''){closeLookup();$('add-title').textContent=(key==='region'?'지역·관측 지점':cols.find(c=>c[0]===key)?.[1]||'항목')+' 신규 추가';$('add-name-label').textContent=key==='region'?'관측 지점명 · 필수':'명칭 · 필수';$('add-name').value=name;$('add-coordinates').hidden=key!=='region';$('add-lat').value='';$('add-lng').value='';$('add-overlay').hidden=false;}
function coord(value,max){const m=String(value||'').match(/^(\d{1,3})\s*°\s*(\d{1,2})\s*[′']\s*(\d{1,2}(?:\.\d+)?)\s*[″"]\s*([NSEW])$/i);if(!m||+m[1]>max||+m[2]>=60||+m[3]>=60||(+m[1]===max&&(+m[2]||+m[3]))||!(max===90?/^[NS]$/i:/^[EW]$/i).test(m[4]))return null;return (+m[1]+m[2]/60+m[3]/3600)*(/[SW]/i.test(m[4])?-1:1);}
function validCoord(value,max){return coord(value,max)!==null;}
document.addEventListener('click',e=>{const row=e.target.closest('[data-row]');if(row){row.checked?selected.add(+row.dataset.row):selected.delete(+row.dataset.row);closeLookup();renderRows();return;}if(e.target.id==='select-all'){selected=e.target.checked?new Set(Array.from({length:171},(_,i)=>i)):new Set();closeLookup();renderRows();return;}const close=e.target.closest('[data-close]');if(close){$(close.dataset.close).hidden=true;closeLookup();return;}const input=e.target.closest('[data-lookup]');if(input){openLookup(input);return;}const save=e.target.closest('.cell-save');if(save){const cell=save.closest('.cell'),r=+cell.dataset.r,c=+cell.dataset.c;if(c===8){if(!(validCoord(draft[r][9],90)&&validCoord(draft[r][10],180)))return;saved[r].splice(8,3,...draft[r].slice(8,11));syncGeo('row-'+r);}else{const inputs=[...cell.querySelectorAll('input')];if(!inputs.every(i=>i.checkValidity()))return;saved[r][c]=draft[r][c];markCell(r,c);}$('change-status').textContent='작업 데이터에 변경 반영 · 최종 저장 전';return;}if(!$('lookup').contains(e.target))closeLookup();});
document.addEventListener('focusin',e=>{document.querySelectorAll('.geo-focus').forEach(c=>c.classList.remove('geo-focus'));const focused=e.target.closest('.cell');if(focused&&+focused.dataset.c>=8&&+focused.dataset.c<=10)document.querySelector(`.cell[data-r="${focused.dataset.r}"][data-c="8"]`)?.classList.add('geo-focus');if(e.target.matches('[data-lookup]')&&!('accepted' in e.target.dataset))e.target.dataset.accepted=e.target.value;});
document.addEventListener('focusout',e=>{if(e.target.matches('[data-lookup]')&&e.target.dataset.pending==='true'){e.target.value=e.target.dataset.accepted||'';delete e.target.dataset.pending;}});
document.addEventListener('input',e=>{if(e.target.matches('[data-lookup]')){if(!('accepted' in e.target.dataset))e.target.dataset.accepted='';e.target.dataset.pending='true';openLookup(e.target,true);const cell=e.target.closest('.cell');if(cell){const save=cell.querySelector('.cell-save');if(save)save.disabled=true;}else document.querySelectorAll(`[data-bulk="${e.target.dataset.lookup}"]`).forEach(b=>b.disabled=true);return;}if(e.target.closest('.cell')||e.target.closest('thead'))record(e.target);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLookup();$('add-overlay').hidden=true;}if(active&&e.key==='ArrowDown'){e.preventDefault();const opts=[...$('lookup-list').querySelectorAll('.option')];const i=opts.indexOf(document.activeElement);opts[(i+1)%opts.length]?.focus();}if(active&&e.key==='ArrowUp'){e.preventDefault();const opts=[...$('lookup-list').querySelectorAll('.option')];const i=opts.indexOf(document.activeElement);opts[(i-1+opts.length)%opts.length]?.focus();}});
document.addEventListener('scroll',e=>{if(!$('lookup').contains(e.target))closeLookup();},true);document.addEventListener('wheel',e=>{if(!$('lookup').contains(e.target))closeLookup();},{capture:true,passive:true});window.addEventListener('resize',closeLookup);window.addEventListener('mockup-viewer:viewport-motion',closeLookup);
function updateBulkPending(){
 const groups=new Set();
 $('bulk-input-row').querySelectorAll('input').forEach(input=>{
  if(!input.value.trim())return;
  const key=input.dataset.key||input.dataset.time;
  if(key)groups.add(['region','lat','lng'].includes(key)?'region':key);
 });
 $('bulk-pending').hidden=groups.size===0;
 const action=$('toggle-bulk').getAttribute('aria-expanded')==='true'?'일괄 입력 접기':'일괄 입력 펼치기';
 const label=action+(groups.size?` · 미적용 입력 ${groups.size}개`:'');
 $('toggle-bulk').title=label;
 $('toggle-bulk').setAttribute('aria-label',label);
}
$('toggle-bulk').addEventListener('click',()=>{
 const expanded=$('toggle-bulk').getAttribute('aria-expanded')!=='true';
 closeLookup();
 $('bulk-input-row').hidden=!expanded;
 $('bulk-action-row').hidden=!expanded;
 $('toggle-bulk').setAttribute('aria-expanded',String(expanded));
 $('bulk-toggle-icon').textContent=expanded?'−':'+';
 updateBulkPending();
});
$('bulk-input-row').addEventListener('input',updateBulkPending);
$('bulk-input-row').addEventListener('change',updateBulkPending);

renderRows();requestAnimationFrame(()=>openLookup($('row-0-category')));
</script></body></html>
