<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>최종 저장 완료</title><style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { width: 1280px; height: 800px; color: #25282d; background: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.5; }
    .app-header { display: flex; align-items: center; justify-content: space-between; width: 1280px; max-width: 100%; height: 80px; padding: 0 56px; border-bottom: 1px solid #d1d5db; background: #ffffff; }
    .app-service-name { color: #24272c; font-size: 22px; font-weight: 700; line-height: 1.4; letter-spacing: -0.035em; }
    .app-profile { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; color: #41464e; background: #ffffff; font: inherit; font-size: 15px; cursor: pointer; }
    .app-user-icon { display: block; width: 24px; height: 24px; color: #757c86; }
    .app-profile-chevron { display: block; width: 16px; height: 16px; margin-left: 4px; color: #757c86; }
    .app-profile:focus-visible { outline: 2px solid #7c8591; outline-offset: 3px; }
    .error-main { display: grid; place-items: center; width: 1280px; height: 720px; }
    .error-state { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 720px; max-width: 100%; height: 344px; padding: 56px; border: 1px solid #d1d5db; border-radius: 12px; background: #ffffff; text-align: center; }
    .error-title { margin: 0; color: #24272c; font-size: 30px; font-weight: 700; line-height: 1.4; letter-spacing: -0.045em; }
    .error-message { margin: 20px 0 0; color: #c43434; font-size: 16px; line-height: 24px; }
    .error-return-button { display: inline-flex; align-items: center; justify-content: center; width: 260px; height: 48px; flex-shrink: 0; margin-top: 36px; padding: 0 24px; border: 1px solid #4e535b; border-radius: 6px; color: #ffffff; background: #535860; font: inherit; font-size: 16px; font-weight: 650; cursor: pointer; }
    .error-return-button:focus-visible { outline: 2px solid #7c8591; outline-offset: 3px; }

.state-main{height:720px;display:grid;place-items:center;padding:40px}.state-card{width:720px;padding:40px 48px;background:#fff;border:1px solid #d1d5db;border-radius:12px;text-align:center}.state-card h1{font-size:28px;letter-spacing:-.04em;margin:18px 0 12px}.message{color:#667180;margin:0 0 28px;line-height:1.7}.error-message{margin:0 0 28px}.symbol{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#eef2f5;color:#536d66;margin:auto;font-size:28px}.symbol.error{color:#ba4949;background:#fcf0f0}.symbol.unknown{color:#a07d36;background:#fbf6e9}.spinner{width:44px;height:44px;margin:0 auto 24px;border:4px solid #e6e9ed;border-top-color:#697d91;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}.facts{padding:8px 20px;background:#f7f8fa;border:1px solid #e3e7ec;border-radius:7px;text-align:left;margin:0}.facts div{display:flex;justify-content:space-between;gap:24px;padding:9px 0}.facts dt{color:#7a8591}.facts dd{margin:0;font-weight:600;color:#404e5d}.actions{display:flex;justify-content:center;gap:10px;margin-top:28px}.action{height:44px;padding:0 20px;border:1px solid #c4ccd5;border-radius:6px;background:#fff;color:#506174;font:inherit;font-size:14px;font-weight:600;cursor:pointer}.action.primary{background:#535e6b;border-color:#535e6b;color:#fff}.download{margin-top:20px;border:0;background:none;color:#64788d;text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}button:focus-visible{outline:2px solid #6b819b;outline-offset:3px}
</style></head><body><header class="app-header">
    <span class="app-service-name">환경데이터 표준화 프로그램</span>
    <button class="app-profile" type="button" aria-label="사용자 메뉴" data-viewer-page="rist-profile-menu" aria-haspopup="menu" aria-expanded="false">
      <svg class="app-user-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"></circle>
        <path d="M 5 21 V 19 A 7 7 0 0 1 19 19 V 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span>박보검</span>
      <svg class="app-profile-chevron" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 4 6 L 8 10 L 12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </header><main class="state-main"><section class="state-card"><div class="symbol" aria-hidden="true">✓</div><h1>저장 완료</h1><p class="message">171행의 데이터를 저장했습니다.</p><dl class="facts"><div><dt>파일명</dt><dd>SIFT-MS offline.csv</dd></div><div><dt>유형</dt><dd>CSV-001</dd></div><div><dt>저장 행 수</dt><dd>171행</dd></div><div><dt>저장 완료 시각</dt><dd>2026/09/21 14:12</dd></div></dl><div class="actions"><button type="button" class="action primary" data-viewer-page="rist-upload">새 파일 업로드</button><button type="button" class="action" data-viewer-page="rist-upload-history-detail">저장 결과 상세</button><button type="button" class="action" data-viewer-page="rist-upload-history">업로드 이력</button></div><button type="button" class="download">원본 파일 다운로드</button></section></main></body></html>
