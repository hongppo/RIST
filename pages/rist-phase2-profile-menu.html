<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필 메뉴(2차 개선)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { width: 1280px; height: 800px; color: #25282d; background: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 16px; line-height: 1.5; }
    .app-header { display: flex; align-items: center; justify-content: space-between; width: 1280px; max-width: 100%; height: 80px; padding: 0 56px; border-bottom: 1px solid #d1d5db; background: #ffffff; }
    .app-service-name { color: #24272c; font-size: 22px; font-weight: 700; line-height: 1.4; letter-spacing: -0.035em; }
    .app-profile { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 6px; color: #41464e; background: #ffffff; font: inherit; font-size: 15px; cursor: pointer; }
    .app-user-icon { display: block; width: 24px; height: 24px; color: #757c86; }
    .app-profile-chevron { display: block; width: 16px; height: 16px; margin-left: 4px; color: #757c86; }
    .app-profile:focus-visible, .file-select-button:focus-visible { outline: 2px solid #7c8591; outline-offset: 3px; }
    .upload-main { width: 1056px; margin: 44px auto 0; }
    .file-upload { width: 1056px; max-width: 100%; }
    .upload-title { margin: 0 0 24px; color: #24272c; font-size: 32px; font-weight: 700; line-height: 1.4; letter-spacing: -0.045em; }
    .file-drop-area { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 330px; padding: 36px; border: 2px dashed #c2c8d0; border-radius: 10px; background: #ffffff; }
    .file-upload-icon { display: block; width: 48px; height: 48px; margin-bottom: 22px; color: #8a929e; }
    .file-drop-message { margin: 0 0 22px; color: #515761; font-size: 20px; font-weight: 500; line-height: 1.5; letter-spacing: -0.025em; }
    .file-select-button { min-width: 132px; height: 44px; padding: 0 24px; border: 1px solid #aeb5be; border-radius: 6px; color: #41464e; background: #ffffff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .upload-error { margin: 16px 0 0; color: #c43434; font-size: 14px; line-height: 22px; }
    .upload-actions { display: flex; align-items: center; justify-content: flex-end; gap: 20px; margin-top: 32px; }
    .upload-submit-button { min-width: 172px; height: 48px; padding: 0 24px; border: 1px solid #d0d4da; border-radius: 6px; color: #9198a2; background: #dce0e5; font: inherit; font-size: 16px; font-weight: 650; cursor: not-allowed; }
  .profile-menu{position:absolute;right:56px;top:68px;width:200px;padding:6px;background:#fff;border:1px solid #ccd5df;border-radius:8px;box-shadow:0 10px 28px #26334526;z-index:10}.profile-menu button{display:block;width:100%;padding:13px 16px;text-align:left;font:inherit;font-size:14px;border:0;border-radius:4px;background:white;color:#465363;cursor:pointer}.profile-menu button:hover,.profile-menu button:focus-visible{background:#f0f3f7}.profile-menu button+button{border-top:1px solid #e6ebef}
[hidden]{display:none!important}.planning-examples{height:40px;display:flex;align-items:center;gap:8px;padding:0 24px;background:#f0edf7;color:#69557e;font-size:11px;border-bottom:1px solid #d7cee5}.planning-examples button,.planning-examples select{font:inherit;padding:4px 8px;border:1px solid #c6b9d4;background:white;border-radius:4px;color:inherit;cursor:pointer}.planning-examples .planning-status{margin-left:auto;font-size:10px}.planning-examples a{color:#69557e;white-space:nowrap}
.flow-dialog{width:660px;max-height:700px;padding:0;border:1px solid #bdc9d5;border-radius:9px;color:#40556b;box-shadow:0 20px 70px #263f5655;font-size:14px}.flow-dialog::backdrop{background:#23354866}.flow-dialog header{padding:20px 24px;border-bottom:1px solid #dbe2e9}.flow-dialog h2{margin:0;font-size:20px;line-height:1.5}.flow-dialog .dialog-content{padding:18px 24px;max-height:480px;overflow:auto}.flow-dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid #dbe2e9}.flow-dialog button{height:38px;font:inherit;border:1px solid #bcc8d4;border-radius:5px;padding:0 16px;background:#fff;color:#52677c;cursor:pointer}.flow-dialog .confirm-action{background:#5b6e82;color:white;border-color:#526579}.flow-dialog dl{display:grid;grid-template-columns:105px 1fr;gap:10px;margin:0 0 18px}.flow-dialog dt{color:#7c8794}.flow-dialog dd{margin:0;overflow-wrap:anywhere}.flow-dialog details{border:1px solid #dde3e9;border-radius:6px;padding:10px 12px}.flow-dialog summary{cursor:pointer}.flow-dialog table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}.flow-dialog th,.flow-dialog td{padding:9px 5px;border-bottom:1px solid #e4e8ee;text-align:left}.flow-dialog p{margin:8px 0;line-height:1.7}.flow-dialog .hint{color:#728195;font-size:12px}.upload-submit-button:not(:disabled){color:white;background:#5b6e82;border-color:#526579;cursor:pointer}.selected-file{margin:12px 0;font-size:14px;color:#52677c}.upload-status{margin-right:auto;color:#62738a;font-size:13px}
.profile-menu{top:108px}</style>
</head>
<body><div class="planning-examples" id="profile-examples" data-document-root><strong>작업 상태</strong><select id="profile-state" aria-label="작업 상태 예시"><option value="idle">작업 없음</option><option value="upload">업로드 중</option><option value="extract">추출 중</option><option value="review" selected>검토 중</option><option value="saved">최종 저장 완료</option></select><span id="profile-demo-status">검토 중</span><span class="planning-status">기존 저장 결과 보존</span><a data-document-download href="../docs/rist-phase2-profile-menu.md" download="프로필 메뉴(2차 개선).md">정책 MD 다운로드</a></div>
  <header class="app-header">
    <span class="app-service-name">환경데이터 표준화 프로그램</span>
    <button class="app-profile" type="button" aria-label="사용자 메뉴" aria-haspopup="menu" aria-expanded="true">
      <svg class="app-user-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"></circle>
        <path d="M 5 21 V 19 A 7 7 0 0 1 19 19 V 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span>박보검</span>
      <svg class="app-profile-chevron" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 4 6 L 8 10 L 12 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </header><nav id="phase2-profile-menu" class="profile-menu" aria-label="사용자 메뉴"><button type="button" id="return-upload">파일 업로드로 돌아가기</button><button type="button" data-viewer-page="rist-upload-history">업로드 이력</button><button type="button" data-viewer-page="rist-login">로그아웃</button></nav>

  <main class="upload-main">
    <section class="file-upload" aria-labelledby="upload-title">
      <h1 class="upload-title" id="upload-title">파일 업로드</h1>
      <div class="file-drop-area" aria-label="파일 1개 드래그 앤드 드롭 영역">
        <svg class="file-upload-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M 24 31 V 7 M 15 16 L 24 7 L 33 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          <path d="M 8 30 V 39 A 3 3 0 0 0 11 42 H 37 A 3 3 0 0 0 40 39 V 30" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <p class="file-drop-message">파일 1개를 끌어 놓거나 선택해 주세요.</p>
        <button class="file-select-button" type="button">파일 선택</button>
      </div>

      <div class="upload-actions">
        <button class="upload-submit-button" type="button" disabled>업로드 및 추출</button>
      </div>
    </section>
  </main>
<dialog class="flow-dialog" id="leave-work-dialog" aria-labelledby="leave-work-title"><header><h2 id="leave-work-title">현재 작업을 종료하고 파일 업로드 화면으로 돌아가시겠습니까?</h2></header><div class="dialog-content"><p>최종 저장하지 않은 검토 내용은 결과 데이터로 등록되지 않습니다.</p></div><footer id="leave-work-actions"><button id="keep-working">계속 작업</button><button class="confirm-action" id="leave-work">작업 종료 후 돌아가기</button></footer></dialog><script>
(()=>{const $=id=>document.getElementById(id);const profile=document.querySelector('.app-profile');let state='review';window.profileMockState={draft:'검토 중 입력 예시',savedResults:171};function menu(open){$('phase2-profile-menu').hidden=!open;profile.setAttribute('aria-expanded',String(open));}function back(){state='idle';$('profile-state').value='idle';menu(false);$('profile-demo-status').textContent='파일 업로드 화면으로 복귀 · 기존 저장 결과 유지';document.querySelector('.upload-title').focus();}profile.onclick=()=>menu($('phase2-profile-menu').hidden);$('profile-state').onchange=e=>{state=e.target.value;window.profileMockState.draft=state==='idle'||state==='saved'?'':'검토 중 입력 예시';menu(true);$('profile-demo-status').textContent=e.target.selectedOptions[0].textContent+'';};$('return-upload').onclick=()=>{if(state==='idle'||state==='saved')back();else $('leave-work-dialog').showModal();};$('keep-working').onclick=()=>$('leave-work-dialog').close();$('leave-work').onclick=()=>{window.profileMockState.draft='';$('leave-work-dialog').close();back();};})();
</script></body>
</html>
